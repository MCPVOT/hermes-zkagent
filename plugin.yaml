name: zkagent-attest
version: 0.5.1
description: "Prove what your agent did without revealing what it did: every tool call is recorded, the session is proved inside a signed cap, and one action can be disclosed on request."
author: MCPVOT
license: MIT
provides_tools:
  - zkagent_status
  - zkagent_attest
  - zkagent_verify
  - zkagent_disclose
provides_hooks:
  - post_tool_call
# Policy units per tool call. These defaults are DEFAULT_COSTS in __init__.py, value for
# value: the settings form and the fallback table must never quote different prices.
# Read precedence is host settings > state.json `costs` > DEFAULT_COSTS; see _read_host_costs.
config_schema:
  read_file:
    type: int
    default: 1
    description: "Policy units charged for one read_file call."
  write_file:
    type: int
    default: 2
    description: "Policy units charged for one write_file call."
  patch:
    type: int
    default: 2
    description: "Policy units charged for one patch call."
  terminal:
    type: int
    default: 3
    description: "Policy units charged for one terminal call."
  web_search:
    type: int
    default: 2
    description: "Policy units charged for one web_search call."
  web_extract:
    type: int
    default: 3
    description: "Policy units charged for one web_extract call."
  browser_exec:
    type: int
    default: 3
    description: "Policy units charged for one browser_exec call."
requires_hermes: ">=0.22.5"
# The Desktop surface needs no key here: `desktop/plugin.js` is the pane and
# `dashboard/plugin_api.py` (declared in `dashboard/manifest.json`) is the read-only route it
# draws from. `hermes plugins validate` finds both by their paths — `desktop/plugin.js` is one
# of the loadable entrypoints it names, and the pane itself is linted by the desktop-surface
# check. There is no `desktop:` field in the manifest schema; adding one would only log an
# "unknown plugin.yaml field" warning at load.
