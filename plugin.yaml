name: zkagent-attest
version: 0.5.0
description: "Verifiable receipts for what an agent actually did: records each tool call, proves the session stayed inside a signed policy cap without revealing which tools ran, and discloses exactly one action on request. Drives the zkagent CLI (Groth16)."
author: MCPVOT
license: MIT
provides_tools:
  - zkagent_status
  - zkagent_attest
  - zkagent_verify
  - zkagent_disclose
provides_hooks:
  - post_tool_call
# Policy units per tool call. These defaults are DEFAULT_COSTS in __init__.py, value for
# value: the settings form and the fallback table must never quote different prices.
# Read precedence is host settings > state.json `costs` > DEFAULT_COSTS; see _read_host_costs.
config_schema:
  read_file:
    type: int
    default: 1
    description: "Policy units charged for one read_file call."
  write_file:
    type: int
    default: 2
    description: "Policy units charged for one write_file call."
  patch:
    type: int
    default: 2
    description: "Policy units charged for one patch call."
  terminal:
    type: int
    default: 3
    description: "Policy units charged for one terminal call."
  web_search:
    type: int
    default: 2
    description: "Policy units charged for one web_search call."
  web_extract:
    type: int
    default: 3
    description: "Policy units charged for one web_extract call."
  browser_exec:
    type: int
    default: 3
    description: "Policy units charged for one browser_exec call."
requires_hermes: ">=0.22.5"
