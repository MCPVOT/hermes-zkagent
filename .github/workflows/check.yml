name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The smoke run and the guard tests execute here, not just the tree-hygiene gates.
      # The binary comes from the repo's own checksum-pinned installer, and --binary is
      # passed explicitly because ~/.local/bin is not on the runner's PATH.
      # No untrusted event input is interpolated into any run step.
      - name: install the pinned zkagent binary
        run: python3 scripts/install-zkagent.py
      - name: repository gates
        run: python3 scripts/check.py --binary "$HOME/.local/bin/zkagent"
