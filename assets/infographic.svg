<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0B0F14"/>
  <text x="60" y="86" fill="#E2E8F0" font-family="monospace" font-size="42" font-weight="bold">zkagent-attest</text>
  <text x="60" y="124" fill="#94A3B8" font-family="sans-serif" font-size="20">verifiable receipts for what an agent did</text>
  <text x="60" y="160" fill="#22D3EE" font-family="monospace" font-size="16">zkagent 0.4.1+2026-11-08 · format 3 · 7,442 constraints</text>
  <g>
