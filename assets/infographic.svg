    <text x="170.0" y="272" fill="#94A3B8" font-family="sans-serif" font-size="15" text-anchor="middle">every tool call, args hashed</text>
  </g>
  <line x1="286" y1="256.0" x2="334" y2="256.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="340" y="210" width="220" height="92" rx="16" fill="#111827" stroke="#22D3EE" stroke-width="3"/>
    <text x="450.0" y="244" fill="#22D3EE" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">2 · ATTEST</text>
    <text x="450.0" y="272" fill="#94A3B8" font-family="sans-serif" font-size="15" text-anchor="middle">signed cap + proof</text>
  </g>
  <line x1="566" y1="256.0" x2="614" y2="256.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="620" y="210" width="220" height="92" rx="16" fill="#111827" stroke="#22D3EE" stroke-width="3"/>
    <text x="730.0" y="244" fill="#22D3EE" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">3 · VERIFY</text>
    <text x="730.0" y="272" fill="#94A3B8" font-family="sans-serif" font-size="15" text-anchor="middle">totals, never actions</text>
  </g>
  <line x1="846" y1="256.0" x2="894" y2="256.0" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="900" y="210" width="220" height="92" rx="16" fill="#111827" stroke="#22D3EE" stroke-width="3"/>
    <text x="1010.0" y="244" fill="#22D3EE" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">4 · DISCLOSE</text>
