  <text x="60" y="546" fill="#F59E0B" font-family="monospace" font-size="16">cap 20 · total 9 · 5 actions</text>
  <text x="60" y="576" fill="#E2E8F0" font-family="monospace" font-size="16">Totals are public. Actions are not.</text>
  <text x="60" y="602" fill="#94A3B8" font-family="sans-serif" font-size="14">Hermes plugin · MCPVOT/hermes-zkagent · the Omarchy bar shows the last verdict as the ZK mark</text>
